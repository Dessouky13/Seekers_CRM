<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-symbol.png" />
    <!-- iOS ignores the manifest for the home-screen icon and needs a square
         PNG here; logo-symbol.png is 317x246 and would be letterboxed. -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <!-- viewport-fit=cover lets the layout extend under the notch and home
         indicator, which is what makes env(safe-area-inset-*) report real
         values instead of 0. Without it the safe-area padding on the tab bar
         would be a no-op on exactly the devices that need it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A1F" />

    <!-- Installable: "Add to Home Screen" gives a standalone window with no
         browser chrome, which is the point of the bottom tab bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agency OS" />

    <title>AI Agency OS — Seekers AI</title>

    <!-- Fonts load here, not from an @import in index.css. That @import sat
         after the @tailwind directives, which CSS forbids, so it was being
         dropped and the whole app silently rendered in system fonts. Declaring
         them here also avoids the serial css -> @import -> font round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <meta name="description" content="Internal operations platform for Seekers AI Automation Solutions" />
    <meta name="author" content="Seekers AI" />

    <meta property="og:title" content="AI Agency OS — Seekers AI" />
    <meta property="og:description" content="Internal operations platform for Seekers AI Automation Solutions" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo-white.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SeekersAI" />
    <meta name="twitter:image" content="/logo-white.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
